<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
    <style>
        body {
            height: 100%;
            margin: 0;
            width: 100vw;
            background: #010a20;
        }

        main {
            position: relative;
            display: flex;
            overflow: hidden;
            gap: 3px;
            filter: blur(10px);
        }

        div.aurora {
            position: relative;
            height: 30vh;
            width: 10px;
            background: linear-gradient(rgba(0, 255, 149,0.8), rgba(0, 255, 221,var(--alpha)));
            animation: aurora var(--duration) var(--delay) ease-in-out,aurora-loop var(--duration) var(--delay) ease-in-out infinite;
        }
        @keyframes aurora {
            0% {
                background: linear-gradient(rgba(0, 255, 149,0.8), rgba(0, 255, 221,var(--alpha)));
            }
            50% {
                background: linear-gradient(rgba(0, 255, 149,0.8), rgba(0, 255, 221,1));
            }
            100% {
                background: linear-gradient(rgba(0, 255, 149,0.8), rgba(0, 255, 221,0));
            }
        }
        @keyframes aurora-loop {
            0% {
                background: linear-gradient(rgba(0, 255, 149,0.8), rgba(0, 255, 221,0));
            }
            50% {
                background: linear-gradient(rgba(0, 255, 149,0.8), rgba(0, 255, 221,1));
            }
            100% {
                background: linear-gradient(rgba(0, 255, 149,0.8), rgba(0, 255, 221,0));
            }
        }
    </style>
</head>

<body>
    <main>

    </main>
    <script src="node_modules/jquery/dist/jquery.js"></script>
    <script>
        function aurora() {
            const body = {
                width: window.innerWidth,
                height: window.innerHeight,
            }
            let pieces = Math.floor(body.width / 10)
            for (let i = 0; i < pieces; i++) {
                $("main").append(`<div class="aurora" style="--alpha: ${Math.random()};--duration: ${Math.random() * 0.4};--delay: ${Math.random() * 0.3}"></div>`)
            }
        }
        aurora()
    </script>
</body>

</html>
