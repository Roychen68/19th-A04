<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Finland</title>
    <link rel="stylesheet" href="./node_modules//bootstrap/dist/css/bootstrap.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar border-bottom d-flex align-items-center w-100">
        <div class="d-flex gap-3 align-items-center">
            <img src="./logo.png" alt="Aurora Finland Logo" class="logo img-fluid">
            <div>
                <h1 class="title mb-0">Aurora Finland</h1>
                <p class="slogan mb-0 d-none d-md-block">
                    追尋北境天空下的極光旅程
                </p>
            </div>
        </div>
        <button type="button" class="navbar-toggler d-lg-none" data-bs-toggle="collapse" data-bs-target="#navbar" aria-label="切換導覽選單">
            <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse d-lg-block border-end col-12" id="navbar">
            <div class="nav d-lg-flex w-100">
                <a href="#index" class="link nav-link col-12 col-md-3 active">首頁</a>
                <a href="#forecast" class="link nav-link col-12 col-md-3">極光預報</a>
                <a href="#journal" class="link nav-link col-12 col-md-3">旅人日記</a>
                <a href="#admin" class="link nav-link col-12 col-md-3">系統管理</a>
            </div>
        </nav>
    </header>
    <main class="main">
        <div class="card col-10 m-auto mt-3 p-3 align-items-center mb-3">
            <h1>旅人日記</h1>
            <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modal">建立投稿</button>
        </div>
        <section class="col-10 mx-auto mb-3" aria-label="旅人日記列表">
            <div class="row row-cols-1 row-cols-md-3 g-4" id="journals"></div>
        </section>
        <div class="modal fade" id="modal">
            <div class="modal-dialog modal-lg">
                <form class="modal-content" id="form">
                    <div class="modal-header">
                        <h2>投稿表單</h2>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6 col-12">
                                <label for="name">旅人暱稱</label>
                                <input type="text" class="form-control" name="name" id="name" required>
                            </div>
                            <div class="col-md-6 col-12">
                                <label for="rate">極光評分(1~5)</label>
                                <input type="number" min="1" max="5" required class="form-control" name="rate"
                                    id="rate">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6 col-12">
                                <label for="location">觀賞地點</label>
                                <input type="text" class="form-control" name="location" id="location" required>
                            </div>
                            <div class="col-md-6 col-12">
                                <label for="date">觀賞日期</label>
                                <input type="date" class="form-control" name="date" id="date" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" name="email" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="review">心得</label>
                            <textarea type="text" name="review" id="review" class="form-control" minlength="10"
                                required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="formFile" class="form-label">選擇照片（照片檔名將顯示於日記）</label>
                            <input class="form-control" type="file" id="formFile" name="image" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-primary">送出</button>
                        <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer class="col-12 border-top p-3">
        <p class="text-secondary text-center">第19屆全國身心障礙者技能競賽 設計者：WebXX</p>
    </footer>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.js"></script>
    <script src="./node_modules/jquery/dist/jquery.js"></script>
    <script src="./main.js"></script>
    <script>
        const form = $("form#form")[0]

        $(function () {
            function fill() {
                const recent = JSON.parse(localStorage.getItem("journal"))

                if (!recent) return

                recent.forEach(([key, value]) => {
                    $(`form#form input[name="${key}"]:not([type='file']),form#form textarea[name="${key}"]`)
                        .val(value)
                })
            }

            fill()
            $(form).on("input change", function () {
                let formData = new FormData(form)
                let recent = [...formData].filter(item => item[0] != "image")
                localStorage.setItem("journal", JSON.stringify(recent))
            })

            data()

            $("#form").on("submit", function (e) {
                e.preventDefault()

                const formData = new FormData(form)

                formData.append("action", "journal")

                fetch("api/manage.php", {
                    method: "POST",
                    body: formData
                })
                    .then(res => res.json())
                    .then(res => {
                        if (res.success) {
                            alert(res.message)
                            form.reset()
                            localStorage.removeItem("journal")
                            bootstrap.Modal.getInstance(document.getElementById("modal")).hide()
                            data()
                        }
                    })
            })
        })

        function data() {
            $.post("api/manage.php", { action: "journals" }, (res) => {
                $("#journals").empty()

                if (!res.data.length) {
                    $("#journals").append(`<div class="col-12"><div class="alert alert-info">目前還沒有旅人日記。</div></div>`)
                    return
                }

                res.data.forEach((item) => {
                    let stars = "★".repeat(item.rate) + "☆".repeat(5 - item.rate)
                    let shortReview = item.review.length > 80 ? item.review.substring(0, 80) + "..." : item.review
                    let more = item.review.length > 80 ? `
                        <div class="collapse" id="review-${item.id}">
                            <p class="card-text">${item.review}</p>
                        </div>
                        <button class="btn btn-sm btn-outline-secondary mb-3" data-bs-toggle="collapse" data-bs-target="#review-${item.id}">閱讀完整內容</button>
                    ` : ""

                    $("#journals").append(`
                        <article class="col">
                            <div class="card h-100">
                                <img src="${item.image}" class="card-img-top journal-image" alt="${item.file_name}">
                                <div class="card-body d-flex flex-column">
                                    <h2 class="h4 card-title">${item.name}</h2>
                                    <p class="mb-1">${item.location}｜${item.date}</p>
                                    <p class="text-warning fs-5 mb-1" aria-label="評分 ${item.rate} 分">${stars}</p>
                                    <p class="text-secondary mb-2">${item.email}</p>
                                    <p class="card-text text-clamp">${shortReview}</p>
                                    ${more}
                                    <p class="small text-secondary">照片：${item.file_name}</p>
                                    <button class="btn btn-outline-primary mt-auto" onclick="bless(${item.id})">
                                        極光祝福 <span id="bless-${item.id}">${item.bless}</span>
                                    </button>
                                </div>
                            </div>
                        </article>
                    `)
                })
            }, "json")
        }

        function bless(id) {
            $.post("api/manage.php", { action: "bless", id: id }, (res) => {
                $(`#bless-${id}`).text(res.bless)
            }, "json")
        }
    </script>
</body>

</html>
