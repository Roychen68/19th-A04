<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Finland</title>
    <link rel="stylesheet" href="./node_modules//bootstrap/dist/css/bootstrap.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar border-bottom d-flex align-items-center w-100">
        <div class="d-flex gap-3 align-items-center">
            <img src="./logo.png" alt="logo" class="logo img-fluid">
            <div>
                <h1 class="title mb-0">Aurora Finland</h1>
                <p class="slogan mb-0 d-none d-md-block">
                    追尋北境天空下的極光旅程
                </p>
            </div>
        </div>
        <button type="button" class="navbar-toggler d-lg-none" data-bs-toggle="collapse" data-bs-target="#navbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse d-lg-block border-end col-12" id="navbar">
            <div class="nav d-lg-flex w-100">
                <a href="#index" class="link nav-link col-12 col-md-3 active">首頁</a>
                <a href="#forecast" class="link nav-link col-12 col-md-3">極光預報</a>
                <a href="#journal" class="link nav-link col-12 col-md-3">旅人日記</a>
                <a href="#admin" class="link nav-link col-12 col-md-3">系統管理</a>
            </div>
        </nav>
    </header>
    <main class="main">
        <div class="card col-10 m-auto mt-3 p-3 align-items-center mb-3›">
            <h1>Journal</h1>
            <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modal">建立投稿</button>
        </div>
        <div class="modal fade" id="modal">
            <div class="modal-dialog modal-lg">
                <form class="modal-content" id="form">
                    <div class="modal-header">
                        <h2></h2>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6 col-12">
                                <label for="name">旅人匿名</label>
                                <input type="text" class="form-control" name="name" id="name" required>
                            </div>
                            <div class="col-md-6 col-12">
                                <label for="rate">極光評分(1~5)</label>
                                <input type="number" min="1" max="5" required class="form-control" name="rate"
                                    id="rate">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6 col-12">
                                <label for="location">觀賞地點</label>
                                <input type="text" class="form-control" name="location" id="location" required>
                            </div>
                            <div class="col-md-6 col-12">
                                <label for="date">觀賞日期</label>
                                <input type="date" class="form-control" name="date" id="date" required max="">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="review">心得</label>
                            <textarea type="text" name="review" id="review" class="form-control"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="formFile" class="form-label">選擇照片</label>
                            <input class="form-control" type="file" id="formFile">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-primary">送出</button>
                        <button class="btn btn-outline-secondary" type="button" data-bs-toggle="modal"
                            data-bs-target="modal">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer class="col-12 border-top">
        <p class="text-secondary text-center mt-3">比賽指定資訊</p>
        <p class="text-secondary text-center">第19屆全國身心障礙者技能競賽 WebXX</p>
    </footer>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.js"></script>
    <script src="./node_modules/jquery/dist/jquery.js"></script>
    <script src="./main.js"></script>
    <script>
        const form = $("form#form")[0]
        $(function () {
            function fill() {
                let formData = new FormData(form)
                const recent = JSON.parse(localStorage.getItem("journal"));
                recent.forEach(([key, index]) => {
                    $(`form#form input[name="${key}"] , form#form textarea[name="${key}"]`).val(index)
                });
            }

            fill()
            $(form).on("input change", function () {
                let formData = new FormData(form)
                console.log([...formData])
                localStorage.setItem("journal", JSON.stringify([...formData]))
            })
            $("#form").on("submit",() => {
                let formData = new FormData(form)
                fetch("api/manage.php", { method: "POST", body: {action: "journal",form:formData} })
                    .then(res => (res) => {
                        console.log(res);

                        alert("表單已送出")
                    })
            })
        })
    </script>
</body>

</html>
