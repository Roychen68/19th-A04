<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Finland</title>
    <link rel="stylesheet" href="./node_modules//bootstrap/dist/css/bootstrap.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar border-bottom d-flex align-items-center w-100">
        <div class="d-flex gap-3 align-items-center">
            <img src="./logo.png" alt="logo" class="logo img-fluid">
            <div>
                <h1 class="title mb-0">Aurora Finland</h1>
                <p class="slogan mb-0 d-none d-md-block">
                    追尋北境天空下的極光旅程
                </p>
            </div>
        </div>
        <button type="button" class="navbar-toggler d-lg-none" data-bs-toggle="collapse" data-bs-target="#navbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse d-lg-block border-end col-12" id="navbar">
            <div class="nav d-lg-flex w-100">
                <a href="#index" class="link nav-link col-12 col-md-3 active">首頁</a>
                <a href="#forecast" class="link nav-link col-12 col-md-3">極光預報</a>
                <a href="#journal" class="link nav-link col-12 col-md-3">旅人日記</a>
                <a href="#admin" class="link nav-link col-12 col-md-3">系統管理</a>
            </div>
        </nav>
    </header>
    <div class="d-lg-flex flex-wrap flex-grow-1 w-100 h-100" id="app">
        <main class="main col-12 col-lg-9">
            <div class="card col-6 m-auto mt-5 p-3 text-center align-items-center">
                <h2>系統管理</h2>
            </div>
        </main>
        <footer class="col-12 border-top mt-3">
            <p class="text-secondary text-center mt-3">比賽指定資訊</p>
            <p class="text-secondary text-center">第19屆全國身心障礙者技能競賽 WebXX</p>
        </footer>
    </div>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.js"></script>
    <script src="./node_modules/jquery/dist/jquery.js"></script>
    <script src="./main.js"></script>
    <script>
        async function login() {
            const form = document.getElementById("form")
            const formData = new FormData(form)
            const response = await fetch("api/login.php", { method: "POST", body: formData })
            const res = await response.json()
            console.log(res)
            if (res.login == true) {
                alert(res.message)
                location.href = "admin.html"
            } else {
                alert(res.message)
                $("input[name='account']").addClass("is-invalid")
                $("input[name='password']").addClass("is-invalid")
            }
        }
        $(document).submit(function (e) {
            e.preventDefault()
            login()
        })
    </script>
</body>

</html>
