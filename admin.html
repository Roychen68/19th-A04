<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Finland</title>
    <link rel="stylesheet" href="./node_modules//bootstrap/dist/css/bootstrap.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar border-bottom d-flex align-items-center w-100">
        <div class="d-flex gap-3 align-items-center">
            <img src="./logo.png" alt="Aurora Finland Logo" class="logo img-fluid">
            <div>
                <h1 class="title mb-0">Aurora Finland</h1>
                <p class="slogan mb-0 d-none d-md-block">
                    追尋北境天空下的極光旅程
                </p>
            </div>
            <div class="AuroraMation position-relative d-flex"></div>
        </div>
        <button type="button" class="navbar-toggler d-lg-none" data-bs-toggle="collapse" data-bs-target="#navbar" aria-label="切換導覽選單">
            <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse d-lg-block border-end col-12" id="navbar">
            <div class="nav d-lg-flex w-100">
                <a href="#index" class="link nav-link col-12 col-md-3 active">首頁</a>
                <a href="#forecast" class="link nav-link col-12 col-md-3">極光預報</a>
                <a href="#journal" class="link nav-link col-12 col-md-3">旅人日記</a>
                <a href="#admin" class="link nav-link col-12 col-md-3">系統管理</a>
            </div>
        </nav>
    </header>
    <div class="w-100 h-100" id="app">
        <main class="main">
            <div class="card col-10 m-auto mt-3 p-3 text-center align-items-center mb-3">
                <h2>系統管理</h2>
            </div>
            <section class="card col-10 mx-auto mb-3 p-3" aria-label="日記管理工具">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label for="search" class="form-label">搜尋暱稱或心得</label>
                        <input type="search" class="form-control" id="search" placeholder="輸入關鍵字">
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="locationFilter" class="form-label">觀賞地點</label>
                        <select class="form-select" id="locationFilter">
                            <option value="">全部地點</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="sort" class="form-label">排序方式</label>
                        <select class="form-select" id="sort">
                            <option value="date_desc">日期：新到舊</option>
                            <option value="date_asc">日期：舊到新</option>
                            <option value="rate_desc">評分：高到低</option>
                            <option value="bless_desc">祝福：高到低</option>
                        </select>
                    </div>
                </div>
                <div class="alert alert-info mt-3 mb-0 d-none" id="emailFilterMessage"></div>
            </section>
            <section class="col-10 mx-auto mb-3" aria-label="完整日記資料">
                <div class="table-responsive card">
                    <table class="table table-striped table-bordered mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>暱稱</th>
                                <th>Email</th>
                                <th>地點</th>
                                <th>日期</th>
                                <th>評分</th>
                                <th>心得</th>
                                <th>照片資訊</th>
                                <th>祝福</th>
                            </tr>
                        </thead>
                        <tbody id="journals">
                            <tr><td colspan="8" class="text-center">讀取中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <footer class="col-12 border-top mt-3 p-3">
            <p class="text-secondary text-center">第19屆全國身心障礙者技能競賽 設計者：WebXX</p>
        </footer>
    </div>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.js"></script>
    <script src="./node_modules/jquery/dist/jquery.js"></script>
    <script src="./main.js"></script>
    <script>
        let journals = []
        let emailFilter = ""

        $(function () {
            $.getJSON("api/admin.php", (res) => {
                if (!res.login) {
                    location.href = "login.html"
                    return
                }

                data()
            })

            $("#search").on("input", render)
            $("#locationFilter, #sort").on("change", render)
        })

        function data() {
            $.post("api/manage.php", { action: "admin_journals" }, (res) => {
                journals = res.data

                let locations = [...new Set(journals.map(item => item.location))]
                locations.forEach((location) => {
                    $("#locationFilter").append(`<option value="${location}">${location}</option>`)
                })

                render()
            }, "json")
        }

        function render() {
            let search = $("#search").val().toLowerCase()
            let location = $("#locationFilter").val()
            let sort = $("#sort").val()

            let data = journals.filter((item) => {
                let matchSearch = item.name.toLowerCase().includes(search) || item.review.toLowerCase().includes(search)
                let matchLocation = !location || item.location == location
                let matchEmail = !emailFilter || item.email == emailFilter
                return matchSearch && matchLocation && matchEmail
            })

            if (sort == "date_asc") data.sort((a, b) => a.date.localeCompare(b.date))
            if (sort == "date_desc") data.sort((a, b) => b.date.localeCompare(a.date))
            if (sort == "rate_desc") data.sort((a, b) => b.rate - a.rate)
            if (sort == "bless_desc") data.sort((a, b) => b.bless - a.bless)

            $("#journals").empty()

            if (!data.length) {
                $("#journals").append(`<tr><td colspan="8" class="text-center">查無符合的日記資料</td></tr>`)
                return
            }

            data.forEach((item) => {
                $("#journals").append(`
                    <tr>
                        <td>${item.name}</td>
                        <td><button class="btn btn-link p-0 email" data-email="${item.email}">${item.email}</button></td>
                        <td>${item.location}</td>
                        <td>${item.date}</td>
                        <td>${item.rate}</td>
                        <td style="min-width: 240px">${item.review}</td>
                        <td>
                            <img src="${item.image}" class="admin-image d-block mb-1" alt="${item.file_name}">
                            <small>${item.file_name}</small>
                        </td>
                        <td>${item.bless}</td>
                    </tr>
                `)
            })

            $(".email").on("click", function () {
                emailFilter = $(this).data("email")
                render()
                $("#clearEmail").on("click", function () {
                    emailFilter = ""
                    render()
                })
            })
        }
    </script>
</body>

</html>
