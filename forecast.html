<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Finland</title>
    <link rel="stylesheet" href="./node_modules//bootstrap/dist/css/bootstrap.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar border-bottom d-flex align-items-center w-100">
        <div class="d-flex gap-3 align-items-center">
            <img src="./logo.png" alt="Aurora Finland Logo" class="logo img-fluid">
            <div>
                <h1 class="title mb-0">Aurora Finland</h1>
                <p class="slogan mb-0 d-none d-md-block">
                    追尋北境天空下的極光旅程
                </p>
            </div>
        </div>
        <button type="button" class="navbar-toggler d-lg-none" data-bs-toggle="collapse" data-bs-target="#navbar" aria-label="切換導覽選單">
            <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse d-lg-block border-end col-12" id="navbar">
            <div class="nav d-lg-flex w-100">
                <a href="#index" class="link nav-link col-12 col-md-3 active">首頁</a>
                <a href="#forecast" class="link nav-link col-12 col-md-3">極光預報</a>
                <a href="#journal" class="link nav-link col-12 col-md-3">旅人日記</a>
                <a href="#admin" class="link nav-link col-12 col-md-3">系統管理</a>
            </div>
        </nav>
    </header>
    <main class="main">
        <div class="card col-10 m-auto mt-3 p-3 text-center">
            <h1>極光預報</h1>
            <form class="row g-3 align-items-center" id="forecast">
                <div class="col-12 col-md">
                    <select class="form-select" id="location">
                        <option value="" selected disabled>選擇一個地點</option>
                        <option value="all">全部地點</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-primary">
                        查詢
                    </button>
                </div>
                <p class="text-secondary mb-0">請選擇地點後按下查詢</p>
            </form>
        </div>

        <section class="col-10 m-auto my-3" aria-label="極光預報查詢結果">
            <div class="row row-cols-1 row-cols-md-3 g-4" id="forecasts"></div>
        </section>
    </main>
    <footer class="col-12 border-top p-3">
        <p class="text-secondary text-center">第19屆全國身心障礙者技能競賽 設計者：WebXX</p>
    </footer>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.js"></script>
    <script src="./node_modules/jquery/dist/jquery.js"></script>
    <script src="./main.js"></script>
    <script>
        let forecasts = []

        function data() {
            $.post("api/get.php", { action: "aurora" }, (res) => {
                forecasts = res.data
                forecasts.forEach((item) => {
                    $("#location").append(`<option value="${item.id}">${item.location}</option>`)
                })
            }, "json")
        }

        function render(data) {
            $("#forecasts").empty()

            if (!data.length) {
                alert("目前沒有預報資料")
                return
            }

            data.forEach((item) => {
                let color = item.recommendation == "高" ? "success" : item.recommendation == "中" ? "warning" : "danger"

                $("#forecasts").append(`
                    <article class="col text-center">
                        <div class="card h-100">
                            <div class="card-body">
                                <h2 class="card-title">${item.location}</h2>
                                <div class="row row-cols-2 g-3 my-2">
                                    <div class="col">
                                        <div class="text-secondary">Kp 指數</div>
                                        <div class="forecast-value">${item.kp}</div>
                                    </div>
                                    <div class="col">
                                        <div class="text-secondary">雲量</div>
                                        <div class="forecast-value">${item.cloud}%</div>
                                    </div>
                                    <div class="col">
                                        <div class="text-secondary">極光機率</div>
                                        <div class="forecast-value">${item.probability}%</div>
                                    </div>
                                    <div class="col">
                                        <div class="text-secondary">最佳觀賞時間</div>
                                        <div class="forecast-value">${item.best_time}</div>
                                    </div>
                                </div>
                                <p>推薦程度：<span class="badge text-bg-${color}">${item.recommendation}</span></p>
                                <p class="text-clamp" id="note-short-${item.id}">${item.note}</p>
                                <div class="collapse" id="note-${item.id}">
                                    <p>${item.note}</p>
                                </div>
                                <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#note-${item.id}">顯示完整備註</button>
                            </div>
                        </div>
                    </article>
                `)
            })
        }

        data()

        $("#forecast").on("submit", function (e) {
            e.preventDefault()

            const selected = $("#location").val()

            if (!selected) {
                alert("請選擇一個地點")
                return
            }

            if (selected === "all") {
                render(forecasts)
            } else {
                render(forecasts.filter(item => item.id == selected))
            }
        })
    </script>
</body>

</html>
